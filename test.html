<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Доступ ограничен</title>
  <style>
    body {
      font-family: sans-serif;
      background: #1e1e2e;
      color: #fff;
      display: grid;
      place-items: center;
      height: 100vh;
      margin: 0;
    }
    div { text-align: center; }
  </style>
</head>
<body>
  <div>
    <h1>🚫 Это приложение сейчас заблокировано</h1>
    <p>Обратись к родителям.</p>
    <form method="POST" style="margin-top: 24px;">
      <input type="password" name="password" placeholder="Пароль родителя"
             style="padding: 8px; border-radius: 6px; border: none; margin-right: 8px;">
      <button type="submit"
              style="padding: 8px 16px; border-radius: 6px; border: none;
                     background: #585b70; color: #fff; cursor: pointer;">
        Разблокировать
      </button>
    </form>
  </div>
</body>
</html>
